name: Deploy Study Quest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble site
        run: |
          mkdir site
          base64 -d site.b64 | tar xz -C site
          npm install --no-save pyodide@314.0.8 @electric-sql/pglite@0.6.0
          node vendor.js
          mkdir -p site/pdf
          for f in pdfdata/pdfdata/pdfs.part*; do cat $f; echo; done | base64 -d | tar x -C site/pdf --strip-components=1
          ls site/pdf | wc -l
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
